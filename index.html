<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mis Lugares Cercanos</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="data/manifest.json">
    <meta name="theme-color" content="#2196f3">
</head>

<body>
    <div class="app-shell container">
        <header class="app-header">
            <div class="title-row">
                <div>
                   <p class="eyebrow mb-1">Localiza la unidad más cercana</p>
                    <h1 class="h3 fw-bold mb-0">Panel de Lugares Cercanos</h1>
                </div>
                <div class="header-metrics" aria-label="Resumen rápido">
                    <div class="metric-pill">
                        <span class="metric-label">Lugares</span>
                        <strong id="totalPlaces">0</strong>
                    </div>
                    <div class="metric-pill">
                        <span class="metric-label">Puntos</span>
                        <strong id="markersState">Activos</strong>
                    </div>
                </div>
            </div>
            <div class="controls">
                <button id="toggleMarkersBtn" class="btn btn-primary">Ocultar puntos</button>
                <button id="refreshLocationBtn" class="btn btn-outline-primary">Actualizar ubicación</button>
            </div>
            <div id="info" class="status-panel alert alert-primary mb-0">
                <span id="statusMsg">Cargando mapa...</span>
            </div>
        </header>
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script src="js/app.js"></script>
</body>

</html>
